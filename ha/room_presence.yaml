# Room presence for the one-room studio: KITCHEN / WORK DESK / PC DESK / away.
# Package file: /opt/homeassistant/config/packages/room_presence.yaml
#
# Inputs (all over MQTT, topics documented in /Rpi4/room-presence/REPORT.md):
#   presence/pcdesk/idle        PC idle seconds   (pc_idle.py, Windows task PresencePcIdle)
#   presence/pcdesk/apple       BLE RSSI summary  (lightbar2mqtt firmware, anchor at the PC desk)
#   presence/workdesk/apple     BLE RSSI summary  (LightController firmware, anchor at the work desk)
#   binary_sensor.kitchenradar_presence + sensor.kitchenradar_detection_distance (LD2410, kitchen)
# Output: sensor.yui_room_zone = kitchen | work_desk | pc_desk | away_or_elsewhere
# and binary_sensor.room_zone_<zone>. Nothing here acts on the lights unless
# input_boolean.room_presence_automations is on (it is OFF by default).

input_boolean:
  room_presence_automations:
    name: Room presence automations
    icon: mdi:motion-sensor
    initial: false

input_number:
  rp_kitchen_max_cm:
    name: Room presence - kitchen radar max distance
    min: 50
    max: 600
    step: 10
    unit_of_measurement: cm
    initial: 250
  rp_hysteresis_db:
    name: Room presence - BLE switch hysteresis
    min: 1
    max: 15
    step: 1
    unit_of_measurement: dB
    initial: 6
  rp_min_rssi:
    name: Room presence - weakest BLE signal that still counts
    min: -100
    max: -60
    step: 1
    unit_of_measurement: dBm
    initial: -90

mqtt:
  sensor:
    - name: "RP PC idle"
      unique_id: rp_pc_idle
      state_topic: "presence/pcdesk/idle"
      value_template: "{{ value_json.idle }}"
      unit_of_measurement: s
      expire_after: 60
    - name: "RP pcdesk apple best"
      unique_id: rp_pcdesk_apple_best
      state_topic: "presence/pcdesk/apple"
      value_template: "{{ value_json.apple_best }}"
      unit_of_measurement: dBm
      expire_after: 30
    - name: "RP pcdesk apple n"
      unique_id: rp_pcdesk_apple_n
      state_topic: "presence/pcdesk/apple"
      value_template: "{{ value_json.apple_n }}"
      expire_after: 30
    - name: "RP pcdesk irk avg"
      unique_id: rp_pcdesk_irk_avg
      state_topic: "presence/pcdesk/apple"
      value_template: "{{ value_json.irk[0].avg if value_json.irk | length > 0 else -127 }}"
      unit_of_measurement: dBm
      expire_after: 30
    - name: "RP pcdesk irk n"
      unique_id: rp_pcdesk_irk_n
      state_topic: "presence/pcdesk/apple"
      value_template: "{{ value_json.irk[0].n if value_json.irk | length > 0 else 0 }}"
      expire_after: 30
    - name: "RP pcdesk irk loaded"
      unique_id: rp_pcdesk_irk_loaded
      state_topic: "presence/pcdesk/apple"
      value_template: "{{ value_json.irk_n }}"
      expire_after: 30
    - name: "RP pcdesk heap"
      unique_id: rp_pcdesk_heap
      state_topic: "presence/pcdesk/apple"
      value_template: "{{ value_json.heap }}"
      unit_of_measurement: B
      expire_after: 30
      entity_category: diagnostic
    - name: "RP workdesk apple best"
      unique_id: rp_workdesk_apple_best
      state_topic: "presence/workdesk/apple"
      value_template: "{{ value_json.apple_best }}"
      unit_of_measurement: dBm
      expire_after: 30
    - name: "RP workdesk apple n"
      unique_id: rp_workdesk_apple_n
      state_topic: "presence/workdesk/apple"
      value_template: "{{ value_json.apple_n }}"
      expire_after: 30
    - name: "RP workdesk irk avg"
      unique_id: rp_workdesk_irk_avg
      state_topic: "presence/workdesk/apple"
      value_template: "{{ value_json.irk[0].avg if value_json.irk | length > 0 else -127 }}"
      unit_of_measurement: dBm
      expire_after: 30
    - name: "RP workdesk irk n"
      unique_id: rp_workdesk_irk_n
      state_topic: "presence/workdesk/apple"
      value_template: "{{ value_json.irk[0].n if value_json.irk | length > 0 else 0 }}"
      expire_after: 30
    - name: "RP workdesk irk loaded"
      unique_id: rp_workdesk_irk_loaded
      state_topic: "presence/workdesk/apple"
      value_template: "{{ value_json.irk_n }}"
      expire_after: 30
    - name: "RP workdesk heap"
      unique_id: rp_workdesk_heap
      state_topic: "presence/workdesk/apple"
      value_template: "{{ value_json.heap }}"
      unit_of_measurement: B
      expire_after: 30
      entity_category: diagnostic
  binary_sensor:
    - name: "RP PC locked"
      unique_id: rp_pc_locked
      state_topic: "presence/pcdesk/idle"
      value_template: "{{ value_json.locked }}"
      payload_on: "1"
      payload_off: "0"
      expire_after: 60
    - name: "RP PC online"
      unique_id: rp_pc_online
      state_topic: "presence/pcdesk/status"
      payload_on: "online"
      payload_off: "offline"

template:
  - sensor:
      # Signal of the owner at each anchor, dBm. With an IRK loaded on the node
      # only the owner's own phone counts (-127 when it was not heard in the last
      # 3 s window); without one, the strongest Apple Nearby/Handoff advert of
      # any device is used (single-occupant approximation, can pick up neighbours).
      - name: "RP pcdesk signal"
        unique_id: rp_pcdesk_signal
        unit_of_measurement: dBm
        state: >
          {% if states('sensor.rp_pcdesk_irk_loaded') | int(0) > 0 %}
            {{ states('sensor.rp_pcdesk_irk_avg') | float(-127) if states('sensor.rp_pcdesk_irk_n') | int(0) > 0 else -127 }}
          {% elif states('sensor.rp_pcdesk_apple_n') | int(0) > 0 %}
            {{ states('sensor.rp_pcdesk_apple_best') | float(-127) }}
          {% else %}-127{% endif %}
      - name: "RP workdesk signal"
        unique_id: rp_workdesk_signal
        unit_of_measurement: dBm
        state: >
          {% if states('sensor.rp_workdesk_irk_loaded') | int(0) > 0 %}
            {{ states('sensor.rp_workdesk_irk_avg') | float(-127) if states('sensor.rp_workdesk_irk_n') | int(0) > 0 else -127 }}
          {% elif states('sensor.rp_workdesk_apple_n') | int(0) > 0 %}
            {{ states('sensor.rp_workdesk_apple_best') | float(-127) }}
          {% else %}-127{% endif %}

      - name: "Yui room zone"
        unique_id: yui_room_zone
        icon: mdi:map-marker-radius
        state: >
          {% set pc_active = is_state('binary_sensor.rp_pc_online', 'on')
               and is_state('binary_sensor.rp_pc_locked', 'off')
               and states('sensor.rp_pc_idle') | float(9999) < 60 %}
          {% set kitchen = is_state('binary_sensor.kitchenradar_presence', 'on')
               and states('sensor.kitchenradar_detection_distance') | float(9999)
                   < states('input_number.rp_kitchen_max_cm') | float(250) %}
          {% set a = states('sensor.rp_pcdesk_signal') | float(-127) %}
          {% set b = states('sensor.rp_workdesk_signal') | float(-127) %}
          {% set h = states('input_number.rp_hysteresis_db') | float(6) %}
          {% set floor = states('input_number.rp_min_rssi') | float(-90) %}
          {% set prev = this.state | default('unknown') if this is defined else 'unknown' %}
          {% if pc_active %}pc_desk
          {% elif kitchen %}kitchen
          {% elif [a, b] | max < floor %}away_or_elsewhere
          {% elif prev == 'pc_desk' %}{{ 'work_desk' if b > a + h else 'pc_desk' }}
          {% elif prev == 'work_desk' %}{{ 'pc_desk' if a > b + h else 'work_desk' }}
          {% else %}{{ 'pc_desk' if a >= b else 'work_desk' }}{% endif %}
        attributes:
          pc_signal_dbm: "{{ states('sensor.rp_pcdesk_signal') }}"
          work_signal_dbm: "{{ states('sensor.rp_workdesk_signal') }}"
          pc_idle_s: "{{ states('sensor.rp_pc_idle') }}"
          kitchen_radar: "{{ states('binary_sensor.kitchenradar_presence') }}"
          kitchen_distance_cm: "{{ states('sensor.kitchenradar_detection_distance') }}"
  - binary_sensor:
      - name: "Room zone kitchen"
        unique_id: room_zone_kitchen
        device_class: occupancy
        state: "{{ is_state('sensor.yui_room_zone', 'kitchen') }}"
        delay_off: "00:00:30"
      - name: "Room zone work desk"
        unique_id: room_zone_work_desk
        device_class: occupancy
        state: "{{ is_state('sensor.yui_room_zone', 'work_desk') }}"
        delay_on: "00:00:08"
        delay_off: "00:01:00"
      - name: "Room zone pc desk"
        unique_id: room_zone_pc_desk
        device_class: occupancy
        state: "{{ is_state('sensor.yui_room_zone', 'pc_desk') }}"
        delay_on: "00:00:05"
        delay_off: "00:00:30"
      - name: "Room zone away"
        unique_id: room_zone_away
        state: "{{ is_state('sensor.yui_room_zone', 'away_or_elsewhere') }}"
        delay_on: "00:02:00"

# Automations: conservative and gated. Every one needs the master switch on,
# darkness (sun below horizon), the 00:30-07:30 quiet window respected, and the
# light not changed by hand in the last 10 minutes (last_changed also moves for
# automation changes, which only makes this stricter).
automation:
  - id: rp_pc_desk_occupied_light_bar_on
    alias: "Room presence: PC desk occupied -> light bar on (warm)"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.room_zone_pc_desk
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.room_presence_automations
        state: "on"
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: time
        after: "07:30:00"
        before: "00:30:00"
      - condition: state
        entity_id: light.monitor_light_bar_light_bar
        state: "off"
      - condition: template
        value_template: >
          {{ (now() - states.light.monitor_light_bar_light_bar.last_changed).total_seconds() > 600 }}
    actions:
      - action: light.turn_on
        target:
          entity_id: light.monitor_light_bar_light_bar
        data:
          color_temp_kelvin: 2900
          brightness_pct: 55
  - id: rp_pc_desk_empty_light_bar_off
    alias: "Room presence: PC desk empty 10 min -> light bar off"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.room_zone_pc_desk
        to: "off"
        for: "00:10:00"
    conditions:
      - condition: state
        entity_id: input_boolean.room_presence_automations
        state: "on"
      - condition: time
        after: "07:30:00"
        before: "00:30:00"
      - condition: state
        entity_id: light.monitor_light_bar_light_bar
        state: "on"
      - condition: template
        value_template: >
          {{ (now() - states.light.monitor_light_bar_light_bar.last_changed).total_seconds() > 600 }}
    actions:
      - action: light.turn_off
        target:
          entity_id: light.monitor_light_bar_light_bar
  - id: rp_work_desk_occupied_light_on
    alias: "Room presence: work desk occupied -> channel B on"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.room_zone_work_desk
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.room_presence_automations
        state: "on"
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: time
        after: "07:30:00"
        before: "00:30:00"
      - condition: state
        entity_id: light.channel_b
        state: "off"
      - condition: template
        value_template: >
          {{ (now() - states.light.channel_b.last_changed).total_seconds() > 600 }}
    actions:
      - action: light.turn_on
        target:
          entity_id: light.channel_b
  - id: rp_work_desk_empty_light_off
    alias: "Room presence: work desk empty 10 min -> channel B off"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.room_zone_work_desk
        to: "off"
        for: "00:10:00"
    conditions:
      - condition: state
        entity_id: input_boolean.room_presence_automations
        state: "on"
      - condition: time
        after: "07:30:00"
        before: "00:30:00"
      - condition: state
        entity_id: light.channel_b
        state: "on"
      - condition: template
        value_template: >
          {{ (now() - states.light.channel_b.last_changed).total_seconds() > 600 }}
    actions:
      - action: light.turn_off
        target:
          entity_id: light.channel_b
