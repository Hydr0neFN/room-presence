sensor:
  - platform: statistics
    name: "RP link pcdesk motion"
    unique_id: rp_link_pcdesk_motion
    entity_id: sensor.rp_pcdesk_csi_motion
    state_characteristic: mean
    max_age:
      seconds: 10
    sampling_size: 30
    precision: 1
  - platform: statistics
    name: "RP link workdesk motion"
    unique_id: rp_link_workdesk_motion
    entity_id: sensor.rp_workdesk_csi_motion
    state_characteristic: mean
    max_age:
      seconds: 10
    sampling_size: 30
    precision: 1
  - platform: statistics
    name: "RP link cyd motion"
    unique_id: rp_link_cyd_motion
    entity_id: sensor.rp_cyd_csi_motion
    state_characteristic: mean
    max_age:
      seconds: 10
    sampling_size: 30
    precision: 1
  - platform: statistics
    name: "RP link kitchen motion"
    unique_id: rp_link_kitchen_motion
    entity_id: sensor.rp_kitchen_csi_motion
    state_characteristic: mean
    max_age:
