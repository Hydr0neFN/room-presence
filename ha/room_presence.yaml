# Room presence for the one-room studio: KITCHEN / WORK DESK / PC DESK / away.
# Package file: /opt/homeassistant/config/packages/room_presence.yaml
#
# Inputs (all over MQTT, topics documented in /Rpi4/room-presence/README.md):
#   presence/pcdesk/idle        PC idle seconds   (pc_idle.py, Windows task PresencePcIdle)
#   presence/pcdesk/apple       BLE RSSI summary  (lightbar2mqtt firmware, anchor at the PC desk)
#   presence/workdesk/apple     BLE RSSI summary  (LightController firmware, anchor at the work desk)
#   presence/kitchen/apple      BLE RSSI summary  (node `kitchen`: powermon C3 above the kitchen counter)
#   presence/cyd/apple          BLE RSSI summary  (NLDeskCYD panel on top of the PC desk, node `cyd`)
#   presence/<pcdesk|workdesk|kitchen|cyd>/csi  WiFi CSI summary JSON ~2 Hz (motion/still per-mille, ok=0 = no usable window)
#   binary_sensor.kitchenradar_presence + sensor.kitchenradar_detection_distance (LD2410, kitchen)
#   sensor.chu_fang_kitchenradar_wifi_signal / sensor.neopixel_neopixel_wifi_signal (ESPHome Wi-Fi link RSSI, 1 Hz)
# Output: sensor.yui_room_zone = kitchen | work_desk | pc_desk | bed | home (at home, place unknown) | away
# and binary_sensor.room_zone_<zone>. Device-free WiFi features (sensor.rp_link_*_motion,
# sensor.rp_<node>_csi_still) feed the fingerprint matcher with weight input_number.rp_feat_weight_db. Nothing here acts on the lights unless
# input_boolean.room_presence_automations is on (it is OFF by default).

input_boolean:
  room_presence_automations:
    name: Room presence automations
    icon: mdi:motion-sensor
    initial: false

input_datetime:
  # Written by automation rp_kitchen_light_operated: last real on/off change of the kitchen light (not an
  # unavailable <-> state flap after a restart). Evidence for the fingerprint zone 'kitchen' for 15 min.
  rp_kitchen_light_op:
    name: Room presence - kitchen light last operated
    has_date: true
    has_time: true

input_number:
  rp_kitchen_max_cm:
    name: Room presence - kitchen radar max distance
    min: 50
    max: 600
    step: 10
    unit_of_measurement: cm
    initial: 250
  rp_hysteresis_db:
    name: Room presence - BLE switch hysteresis
    min: 1
    max: 15
    step: 1
    unit_of_measurement: dB
    initial: 6
  rp_fp_hysteresis:
    name: Room presence - fingerprint switch hysteresis
    min: 0
    max: 10
    step: 0.5
    unit_of_measurement: dB
    initial: 2.5
  rp_feat_weight_db:
    name: Room presence - feature weight (dB per sigma)
    min: 0
    max: 20
    step: 0.5
    unit_of_measurement: dB
    initial: 0
  rp_min_rssi:
    name: Room presence - weakest BLE signal that still counts
    min: -100
    max: -60
    step: 1
    unit_of_measurement: dBm
    initial: -90

mqtt:
  sensor:
    - name: "RP PC idle"
      unique_id: rp_pc_idle
      state_topic: "presence/pcdesk/idle"
      value_template: "{{ value_json.idle }}"
      unit_of_measurement: s
      expire_after: 60
    # BLE scanner health (firmware ble_presence.cpp watchdog, presence/pcdesk/ble every 30 s):
    # state 1 = scanning, 2 = deferred start after a crash reset, 3 = init failed (retrying), 0 = off
    - name: "RP pcdesk ble state"
      unique_id: rp_pcdesk_ble_state
      state_topic: "presence/pcdesk/ble"
      value_template: "{{ value_json.state }}"
      expire_after: 120
    - name: "RP pcdesk reset reason"
      unique_id: rp_pcdesk_reset_reason
      state_topic: "presence/pcdesk/ble"
      value_template: "{{ value_json.rr }}"
      expire_after: 120
    - name: "RP pcdesk scan restarts"
      unique_id: rp_pcdesk_scan_restarts
