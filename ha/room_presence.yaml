    state_characteristic: standard_deviation
    max_age:
      seconds: 20
    sampling_size: 30
    precision: 2
  - platform: statistics
    name: "RP link kitchenradar motion"
    unique_id: rp_link_kitchenradar_motion
    entity_id: sensor.chu_fang_kitchenradar_wifi_signal
    state_characteristic: standard_deviation
    max_age:
