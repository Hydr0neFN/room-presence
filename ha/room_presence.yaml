    state_characteristic: standard_deviation
    max_age:
      seconds: 20
    sampling_size: 30
    precision: 2

  # Kitchen evidence: highest powermon reading of the last 120 s (>= 1000 W = someone is cooking).
  - platform: statistics
    name: "RP power max120"
    unique_id: rp_power_max120
    entity_id: sensor.power_monitor_power
    state_characteristic: value_max
    max_age:
      seconds: 120
    sampling_size: 40
    precision: 0
  # Night bed rule: spread of the phone RSSI over 10 min on the two anchors that nearly always hear it
  # (cyd, kitchen). Only windows where the phone was heard count (rp_<node>_phone_heard is unavailable otherwise).
  - platform: statistics
    name: "RP cyd phone sd10m"
    unique_id: rp_cyd_phone_sd10m
    entity_id: sensor.rp_cyd_phone_heard
    state_characteristic: standard_deviation
    max_age:
      minutes: 10
    sampling_size: 600
    precision: 2
  - platform: statistics
    name: "RP kitchen phone sd10m"
    unique_id: rp_kitchen_phone_sd10m
    entity_id: sensor.rp_kitchen_phone_heard
    state_characteristic: standard_deviation
    max_age:
      minutes: 10
    sampling_size: 600
    precision: 2

template:
  - sensor:
      # Signal of the owner's PHONE at each anchor, dBm (-127 = not heard in the last
      # 3 s window). With a phone IRK loaded only the IRK-resolved phone counts. Without
      # one the strongest Apple advert of a NON-stationary device is used (the node drops
      # adverts whose RSSI stays in a narrow band for 5+ min: MacBooks, iPad), which is
      # unreliable (neighbours, a phone lying still gets filtered too): load the IRK.
      # The watch never feeds the zone (it lies on a table at home).
      - name: "RP pcdesk signal"
        unique_id: rp_pcdesk_signal
        unit_of_measurement: dBm
        state: >
          {% if states('sensor.rp_pcdesk_phone_loaded') | int(0) > 0 %}
            {{ states('sensor.rp_pcdesk_irk_avg') | float(-127) if states('sensor.rp_pcdesk_irk_n') | int(0) > 0 else -127 }}
          {% elif states('sensor.rp_pcdesk_mov_n') | int(0) > 0 %}
            {{ states('sensor.rp_pcdesk_mov_best') | float(-127) }}
          {% else %}-127{% endif %}
      - name: "RP workdesk signal"
        unique_id: rp_workdesk_signal
        unit_of_measurement: dBm
        state: >
          {% if states('sensor.rp_workdesk_phone_loaded') | int(0) > 0 %}
            {{ states('sensor.rp_workdesk_irk_avg') | float(-127) if states('sensor.rp_workdesk_irk_n') | int(0) > 0 else -127 }}
          {% elif states('sensor.rp_workdesk_mov_n') | int(0) > 0 %}
            {{ states('sensor.rp_workdesk_mov_best') | float(-127) }}
          {% else %}-127{% endif %}
      - name: "RP cyd signal"
        unique_id: rp_cyd_signal
        unit_of_measurement: dBm
        state: >
          {% if states('sensor.rp_cyd_phone_loaded') | int(0) > 0 %}
            {{ states('sensor.rp_cyd_irk_avg') | float(-127) if states('sensor.rp_cyd_irk_n') | int(0) > 0 else -127 }}
          {% elif states('sensor.rp_cyd_mov_n') | int(0) > 0 %}
            {{ states('sensor.rp_cyd_mov_best') | float(-127) }}
          {% else %}-127{% endif %}
      - name: "RP kitchen signal"
        unique_id: rp_kitchen_signal
        unit_of_measurement: dBm
        state: >
          {% if states('sensor.rp_kitchen_phone_loaded') | int(0) > 0 %}
            {{ states('sensor.rp_kitchen_irk_avg') | float(-127) if states('sensor.rp_kitchen_irk_n') | int(0) > 0 else -127 }}
          {% elif states('sensor.rp_kitchen_mov_n') | int(0) > 0 %}
            {{ states('sensor.rp_kitchen_mov_best') | float(-127) }}
          {% else %}-127{% endif %}
      - name: "RP nlpi signal"
        unique_id: rp_nlpi_signal
        unit_of_measurement: dBm
        state: >
          {% if states('sensor.rp_nlpi_phone_loaded') | int(0) > 0 %}
            {{ states('sensor.rp_nlpi_irk_avg') | float(-127) if states('sensor.rp_nlpi_irk_n') | int(0) > 0 else -127 }}
          {% elif states('sensor.rp_nlpi_mov_n') | int(0) > 0 %}
            {{ states('sensor.rp_nlpi_mov_best') | float(-127) }}
          {% else %}-127{% endif %}

      # Phone RSSI of a node, only while it is heard (unavailable otherwise). Input of the 10 min
      # spread statistics used by the night bed rule.
      - name: "RP cyd phone heard"
        unique_id: rp_cyd_phone_heard
        unit_of_measurement: dBm
        state_class: measurement
        availability: "{{ states('sensor.rp_cyd_signal') | float(-127) > -127 }}"
        state: "{{ states('sensor.rp_cyd_signal') | float(-127) }}"
      - name: "RP kitchen phone heard"
        unique_id: rp_kitchen_phone_heard
        unit_of_measurement: dBm
        state_class: measurement
        availability: "{{ states('sensor.rp_kitchen_signal') | float(-127) > -127 }}"
        state: "{{ states('sensor.rp_kitchen_signal') | float(-127) }}"

      # Nearest-fingerprint zone (written by calibrate.py). Distance in dB-equivalents:
      #   d2 = ( sum_ble_nodes wn * (signal - mu)^2 + w^2 * sum_features ((x - mu) / sigma)^2 )
      #        / (sum_ble_nodes wn + n_features_used),  r = sqrt(d2)
      # Nodes: nlpi is left out (flat across zones, 30 dB offset vs calibration; it stays a home/away input),
      # a node with binary_sensor.rp_<node>_ble_stale on is skipped (not treated as -100), the flat nodes
      # workdesk / kitchen count half (wn 0.5), cyd and pcdesk full. Unheard but healthy nodes count as -100.
      # With less than 1.5 weight of usable nodes the state is 'none'.
      # Features (attribute 'feat' of sensor.rp_fingerprints) are
      #   csi_<node>_motion -> sensor.rp_link_<node>_motion    csi_<node>_still -> sensor.rp_<node>_csi_still
      #   link_<name>       -> sensor.rp_link_<name>_motion
      # A feature whose live state is not numeric, or that the zone lacks, is skipped for that
      # comparison. w = input_number.rp_feat_weight_db (0 disables features, default 0). 'none' until calibrated.
      - name: "RP fp zone"
        unique_id: rp_fp_zone
        state: >
          {% set nodes = state_attr('sensor.rp_fingerprints', 'nodes') or [] %}
          {% set zones = state_attr('sensor.rp_fingerprints', 'zones') or {} %}
          {% set feat = state_attr('sensor.rp_fingerprints', 'feat') or {} %}
          {% set fz = feat.get('zones') or {} %}
          {% set fs = feat.get('scale') or {} %}
          {% set wt = {'cyd': 1.0, 'pcdesk': 1.0, 'workdesk': 0.5, 'kitchen': 0.5} %}
          {% set w = states('input_number.rp_feat_weight_db') | float(0) %}
          {% set prev = this.state | default('none') if this is defined else 'none' %}
          {% set ns = namespace(best='none', bd=999, pd=999) %}
          {% set cur = namespace(l=[]) %}
          {% set use = namespace(l=[], tw=0) %}
          {% for n in nodes %}
            {% if n != 'nlpi' and not is_state('binary_sensor.rp_' ~ n ~ '_ble_stale', 'on') %}
              {% set use.l = use.l + [n] %}
              {% set use.tw = use.tw + wt.get(n, 1.0) %}
            {% endif %}
          {% endfor %}
          {% if w > 0 %}
            {% for fn in (feat.get('names') or []) %}
              {% set p = fn.split('_') %}
              {% set eid = ('sensor.rp_' ~ p[1] ~ '_csi_still') if (p[0] == 'csi' and p[2] == 'still') else ('sensor.rp_link_' ~ p[1] ~ '_motion') %}
              {% set x = states(eid) | float(none) %}
              {% if x is not none %}{% set cur.l = cur.l + [[fn, x]] %}{% endif %}
            {% endfor %}
          {% endif %}
          {% if use.tw >= 1.5 %}
            {% for z, f in zones.items() %}
              {% set t = namespace(d=0, k=0) %}
              {% for n in use.l %}
                {% set sg = [states('sensor.rp_' ~ n ~ '_signal') | float(-127), -100] | max %}
                {% set t.d = t.d + wt.get(n, 1.0) * (sg - (f[n] | float(-100))) ** 2 %}
              {% endfor %}
              {% set fv = fz.get(z) or {} %}
              {% for fn, x in cur.l %}
                {% set mu = fv.get(fn) | float(none) %}
                {% set sd = fs.get(fn) | float(0) %}
                {% if mu is not none and sd > 0 %}
                  {% set t.d = t.d + (w * (x - mu) / sd) ** 2 %}
                  {% set t.k = t.k + 1 %}
                {% endif %}
              {% endfor %}
              {% set r = (t.d / ([use.tw + t.k, 1] | max)) ** 0.5 %}
              {% if r < ns.bd %}{% set ns.bd = r %}{% set ns.best = z %}{% endif %}
              {% if z == prev %}{% set ns.pd = r %}{% endif %}
            {% endfor %}
          {% endif %}
          {% set h = states('input_number.rp_fp_hysteresis') | float(2.5) %}
          {{ 'none' if use.tw < 1.5 else (prev if prev in zones and ns.pd - ns.bd < h else ns.best) }}
      # Zone, in order (first match wins):
      #   PC unlocked and idle < 60 s            -> pc_desk
      #   yui_home off                           -> away
      #   prev pc_desk, PC unlocked, idle < 300 s, no radar -> pc_desk   (hold: a pause at the PC is not leaving it)
      #   kitchen radar hint (held 30 s)         -> kitchen
      #   no node hears the phone (< floor)      -> home
      #   night bed rule                         -> bed
      #   fingerprint zone; 'kitchen' only with evidence (radar, powermon max120 >= 1000 W, kitchen light operated
      #   in the last 15 min), else home; no fingerprint zone -> home (legacy pcdesk/workdesk comparison only
      #   when no fingerprints exist at all)
      # Minimum dwell: a change driven only by the fingerprint / fallback (not by PC activity, away, radar or the
      # night rule) waits until the current zone is 45 s old.
      - name: "Yui room zone"
        unique_id: yui_room_zone
        icon: mdi:map-marker-radius
        state: >
          {% set pc_unlocked = is_state('binary_sensor.rp_pc_online', 'on')
               and is_state('binary_sensor.rp_pc_locked', 'off') %}
          {% set idle = states('sensor.rp_pc_idle') | float(9999) %}
          {% set pc_active = pc_unlocked and idle < 60 %}
          {% set kitchen = is_state('binary_sensor.rp_kitchen_radar_hint', 'on') %}
          {% set kit_ev = is_state('binary_sensor.rp_kitchen_evidence', 'on') %}
          {% set a = states('sensor.rp_pcdesk_signal') | float(-127) %}
          {% set b = states('sensor.rp_workdesk_signal') | float(-127) %}
          {% set c = states('sensor.rp_nlpi_signal') | float(-127) %}
          {% set d = states('sensor.rp_kitchen_signal') | float(-127) %}
          {% set e = states('sensor.rp_cyd_signal') | float(-127) %}
          {% set h = states('input_number.rp_hysteresis_db') | float(6) %}
          {% set floor = states('input_number.rp_min_rssi') | float(-90) %}
          {% set fp = states('sensor.rp_fp_zone') %}
          {% set prev = this.state | default('unknown') if this is defined else 'unknown' %}
          {% set age = (now() - this.last_changed).total_seconds() if (this is defined and this.last_changed is defined) else 9999 %}
          {% set ns = namespace(z='home', soft=false) %}
          {% if pc_active %}{% set ns.z = 'pc_desk' %}
          {% elif is_state('binary_sensor.yui_home', 'off') %}{% set ns.z = 'away' %}
          {% elif prev == 'pc_desk' and pc_unlocked and idle < 300 and not kitchen %}{% set ns.z = 'pc_desk' %}
          {% elif kitchen %}{% set ns.z = 'kitchen' %}
          {% elif [a, b, c, d, e] | max < floor %}{% set ns.z = 'home' %}
          {% elif is_state('binary_sensor.rp_night_bed', 'on') %}{% set ns.z = 'bed' %}
          {% elif fp not in ['none', 'unknown', 'unavailable'] %}
            {% set ns.soft = true %}
            {% set ns.z = fp if (fp != 'kitchen' or kit_ev) else 'home' %}
          {% elif state_attr('sensor.rp_fingerprints', 'zones') %}{% set ns.soft = true %}{% set ns.z = 'home' %}
          {% elif prev == 'pc_desk' %}{% set ns.soft = true %}{% set ns.z = 'work_desk' if b > a + h else 'pc_desk' %}
          {% elif prev == 'work_desk' %}{% set ns.soft = true %}{% set ns.z = 'pc_desk' if a > b + h else 'work_desk' %}
          {% else %}{% set ns.soft = true %}{% set ns.z = 'pc_desk' if a >= b else 'work_desk' %}{% endif %}
          {% if ns.soft and prev in ['kitchen', 'work_desk', 'pc_desk', 'bed', 'home'] and ns.z != prev and age < 45 %}{{ prev }}{% else %}{{ ns.z }}{% endif %}
        attributes:
          home: "{{ states('binary_sensor.yui_home') }}"
          pc_signal_dbm: "{{ states('sensor.rp_pcdesk_signal') }}"
          work_signal_dbm: "{{ states('sensor.rp_workdesk_signal') }}"
          bed_signal_dbm: "{{ states('sensor.rp_nlpi_signal') }}"
          kitchen_signal_dbm: "{{ states('sensor.rp_kitchen_signal') }}"
          cyd_signal_dbm: "{{ states('sensor.rp_cyd_signal') }}"
          pc_idle_s: "{{ states('sensor.rp_pc_idle') }}"
          kitchen_radar: "{{ states('binary_sensor.kitchenradar_presence') }}"
          kitchen_distance_cm: "{{ states('sensor.kitchenradar_detection_distance') }}"
          kitchen_evidence: "{{ states('binary_sensor.rp_kitchen_evidence') }}"
          night_bed: "{{ states('binary_sensor.rp_night_bed') }}"
  - binary_sensor:
      - name: "Room zone kitchen"
        unique_id: room_zone_kitchen
        device_class: occupancy
        state: "{{ is_state('sensor.yui_room_zone', 'kitchen') }}"
        delay_off: "00:00:30"
      - name: "Room zone work desk"
        unique_id: room_zone_work_desk
        device_class: occupancy
        state: "{{ is_state('sensor.yui_room_zone', 'work_desk') }}"
        delay_on: "00:00:08"
        delay_off: "00:01:00"
      - name: "Room zone pc desk"
        unique_id: room_zone_pc_desk
        device_class: occupancy
        state: "{{ is_state('sensor.yui_room_zone', 'pc_desk') }}"
        delay_on: "00:00:05"
        delay_off: "00:00:30"
      - name: "Room zone bed"
        unique_id: room_zone_bed
        device_class: occupancy
        state: "{{ is_state('sensor.yui_room_zone', 'bed') }}"
        delay_on: "00:00:10"
        delay_off: "00:01:00"
      - name: "Room zone away"
        unique_id: room_zone_away
        state: "{{ is_state('sensor.yui_room_zone', 'away') }}"
      # --- node health. A node whose BLE data is missing (no MQTT for 30 s) or that does not hear the phone
      # while another node does, for 5 min, is "stale": the fingerprint matcher skips it instead of
      # reading it as -100 (pcdesk was silent 14.4 h on 2026-10-27/28 while its CSI still ran).
      - name: "RP pcdesk ble stale"
        unique_id: rp_pcdesk_ble_stale
        device_class: problem
        delay_on: "00:05:00"
        state: >
          {{ states('sensor.rp_pcdesk_apple_n') in ['unavailable', 'unknown']
             or (states('sensor.rp_pcdesk_signal') | float(-127) <= -127
                 and ['sensor.rp_cyd_signal', 'sensor.rp_workdesk_signal', 'sensor.rp_nlpi_signal', 'sensor.rp_kitchen_signal']
                     | map('states') | map('float', -127) | select('gt', -127) | list | count > 0) }}
      - name: "RP cyd ble stale"
        unique_id: rp_cyd_ble_stale
        device_class: problem
        delay_on: "00:05:00"
        state: >
          {{ states('sensor.rp_cyd_apple_n') in ['unavailable', 'unknown']
             or (states('sensor.rp_cyd_signal') | float(-127) <= -127
                 and ['sensor.rp_pcdesk_signal', 'sensor.rp_workdesk_signal', 'sensor.rp_nlpi_signal', 'sensor.rp_kitchen_signal']
                     | map('states') | map('float', -127) | select('gt', -127) | list | count > 0) }}
      - name: "RP workdesk ble stale"
        unique_id: rp_workdesk_ble_stale
        device_class: problem
        delay_on: "00:05:00"
        state: >
          {{ states('sensor.rp_workdesk_apple_n') in ['unavailable', 'unknown']
             or (states('sensor.rp_workdesk_signal') | float(-127) <= -127
                 and ['sensor.rp_pcdesk_signal', 'sensor.rp_cyd_signal', 'sensor.rp_nlpi_signal', 'sensor.rp_kitchen_signal']
                     | map('states') | map('float', -127) | select('gt', -127) | list | count > 0) }}
      - name: "RP nlpi ble stale"
        unique_id: rp_nlpi_ble_stale
        device_class: problem
        delay_on: "00:05:00"
        state: >
          {{ states('sensor.rp_nlpi_apple_n') in ['unavailable', 'unknown']
             or (states('sensor.rp_nlpi_signal') | float(-127) <= -127
                 and ['sensor.rp_pcdesk_signal', 'sensor.rp_cyd_signal', 'sensor.rp_workdesk_signal', 'sensor.rp_kitchen_signal']
                     | map('states') | map('float', -127) | select('gt', -127) | list | count > 0) }}
      - name: "RP kitchen ble stale"
        unique_id: rp_kitchen_ble_stale
        device_class: problem
        delay_on: "00:05:00"
        state: >
          {{ states('sensor.rp_kitchen_apple_n') in ['unavailable', 'unknown']
             or (states('sensor.rp_kitchen_signal') | float(-127) <= -127
                 and ['sensor.rp_pcdesk_signal', 'sensor.rp_cyd_signal', 'sensor.rp_workdesk_signal', 'sensor.rp_nlpi_signal']
                     | map('states') | map('float', -127) | select('gt', -127) | list | count > 0) }}
      # Alert: any node stale (5 min) for another 10 min (= 15 min without data) while the owner is home.
      # automation rp_ble_stale_notify turns it into a persistent notification.
      - name: "RP ble stale alert"
        unique_id: rp_ble_stale_alert
        device_class: problem
        delay_on: "00:10:00"
        state: >
          {{ is_state('binary_sensor.yui_home', 'on')
             and (['binary_sensor.rp_pcdesk_ble_stale', 'binary_sensor.rp_cyd_ble_stale', 'binary_sensor.rp_workdesk_ble_stale',
                   'binary_sensor.rp_nlpi_ble_stale', 'binary_sensor.rp_kitchen_ble_stale']
                  | map('states') | select('eq', 'on') | list | count > 0) }}
        attributes:
          nodes: >-
            {% set ns = namespace(l=[]) %}
            {% for n in ['pcdesk', 'cyd', 'workdesk', 'nlpi', 'kitchen'] %}
              {% if is_state('binary_sensor.rp_' ~ n ~ '_ble_stale', 'on') %}{% set ns.l = ns.l + [n] %}{% endif %}
            {% endfor %}
            {{ ns.l | join(',') }}
      # --- kitchen evidence. Radar hint = presence on and closer than rp_kitchen_max_cm, released 30 s late
      # (the radar flickers). The fingerprint may only say 'kitchen' with evidence: the radar hint, the
      # powermon at >= 1000 W within 120 s, or the kitchen light operated within the last 15 min.
      - name: "RP kitchen radar hint"
        unique_id: rp_kitchen_radar_hint
        delay_off: "00:00:30"
        state: >
          {{ is_state('binary_sensor.kitchenradar_presence', 'on')
             and states('sensor.kitchenradar_detection_distance') | float(9999)
                 < states('input_number.rp_kitchen_max_cm') | float(250) }}
      - name: "RP kitchen evidence"
        unique_id: rp_kitchen_evidence
        state: >
          {{ is_state('binary_sensor.rp_kitchen_radar_hint', 'on')
             or states('sensor.rp_power_max120') | float(0) >= 1000
             or now().timestamp() - state_attr('input_datetime.rp_kitchen_light_op', 'timestamp') | float(0) <= 900 }}
      # --- night bed rule: 00:30-07:30, owner home, PC idle > 30 min (or off / locked), no kitchen radar,
      # phone RSSI spread <= 3.5 dB over the last 10 min on both cyd and kitchen (windows >= 80 % covered).
      - name: "RP night bed"
        unique_id: rp_night_bed
        delay_off: "00:01:00"
        state: >
          {% set m = now().hour * 60 + now().minute %}
          {% set sd1 = states('sensor.rp_cyd_phone_sd10m') | float(none) %}
          {% set sd2 = states('sensor.rp_kitchen_phone_sd10m') | float(none) %}
          {% set cv1 = state_attr('sensor.rp_cyd_phone_sd10m', 'age_coverage_ratio') | float(0) %}
          {% set cv2 = state_attr('sensor.rp_kitchen_phone_sd10m', 'age_coverage_ratio') | float(0) %}
          {{ 30 <= m < 450
             and is_state('binary_sensor.yui_home', 'on')
             and is_state('binary_sensor.rp_kitchen_radar_hint', 'off')
             and (states('sensor.rp_pc_idle') | float(9999) > 1800 or is_state('binary_sensor.rp_pc_online', 'off')
                  or is_state('binary_sensor.rp_pc_locked', 'on'))
             and sd1 is not none and sd2 is not none and cv1 >= 0.8 and cv2 >= 0.8
             and [sd1, sd2] | max <= 3.5 }}
      # --- home / away. Phone IRK (any node) is the main evidence, the HA mobile app
      # tracker (device_tracker.ephone) the second. The watch lies on the table at home
      # and only goes out ~90 % of the time, so "watch heard" never keeps the owner home
      # by itself once the phone is gone and the app says not_home.
      - name: "RP phone seen"
        unique_id: rp_phone_seen
        state: >
          {{ ['sensor.rp_pcdesk_irk_n', 'sensor.rp_workdesk_irk_n', 'sensor.rp_nlpi_irk_n', 'sensor.rp_kitchen_irk_n', 'sensor.rp_cyd_irk_n']
             | map('states') | map('int', 0) | select('gt', 0) | list | count > 0 }}
      - name: "RP watch seen"
        unique_id: rp_watch_seen
        state: >
          {{ ['sensor.rp_pcdesk_watch_n', 'sensor.rp_workdesk_watch_n', 'sensor.rp_nlpi_watch_n', 'sensor.rp_kitchen_watch_n', 'sensor.rp_cyd_watch_n']
             | map('states') | map('int', 0) | select('gt', 0) | list | count > 0 }}
      - name: "RP nodes alive"
        unique_id: rp_nodes_alive
        state: >
          {{ ['sensor.rp_pcdesk_apple_n', 'sensor.rp_workdesk_apple_n', 'sensor.rp_nlpi_apple_n', 'sensor.rp_kitchen_apple_n', 'sensor.rp_cyd_apple_n']
             | map('states') | select('in', ['unavailable', 'unknown']) | list | count < 5 }}
      - name: "RP phone IRK loaded"
        unique_id: rp_phone_irk_loaded
        state: >
          {{ ['sensor.rp_pcdesk_phone_loaded', 'sensor.rp_workdesk_phone_loaded', 'sensor.rp_nlpi_phone_loaded', 'sensor.rp_kitchen_phone_loaded', 'sensor.rp_cyd_phone_loaded']
             | map('states') | map('int', 0) | select('gt', 0) | list | count > 0 }}
      # Away condition (must hold 5 min): the PC is not in use AND
      #   no phone IRK loaded: only the app tracker says not_home;
      #   else phone not heard by any node AND (watch not heard OR app says not_home);
      #   no node alive: only the app tracker.
      - name: "RP away condition"
        unique_id: rp_away_condition
        delay_on: "00:05:00"
        state: >
          {% set pc_active = is_state('binary_sensor.rp_pc_online', 'on')
               and is_state('binary_sensor.rp_pc_locked', 'off')
               and states('sensor.rp_pc_idle') | float(9999) < 60 %}
          {% set app_away = is_state('device_tracker.ephone', 'not_home') %}
          {% if pc_active %}false
          {% elif is_state('binary_sensor.rp_nodes_alive', 'off') or is_state('binary_sensor.rp_phone_irk_loaded', 'off') %}{{ app_away }}
          {% else %}{{ is_state('binary_sensor.rp_phone_seen', 'off')
                       and (is_state('binary_sensor.rp_watch_seen', 'off') or app_away) }}{% endif %}
      - name: "Yui home"
        unique_id: yui_home
        device_class: presence
        state: "{{ is_state('binary_sensor.rp_away_condition', 'off') }}"

# Automations: conservative and gated. Every one needs the master switch on,
# darkness (sun below horizon), the 00:30-07:30 quiet window respected, and the
# light not changed by hand in the last 10 minutes (last_changed also moves for
# automation changes, which only makes this stricter).
automation:
  - id: rp_reload_mqtt_via_mqtt
    alias: "RP reload MQTT entities on ha/admin/reload_mqtt"
    description: Publish anything to ha/admin/reload_mqtt after editing the mqtt section of this package.
    triggers:
      - trigger: mqtt
        topic: ha/admin/reload_mqtt
    actions:
      - action: mqtt.reload
    mode: single
  - id: rp_ble_stale_notify
    alias: "RP BLE node stale -> persistent notification"
    description: A BLE anchor sent no phone data for 15 min while the owner is home (see binary_sensor.rp_<node>_ble_stale).
    triggers:
      - trigger: state
        entity_id: binary_sensor.rp_ble_stale_alert
        to: "on"
        id: raise
      - trigger: state
        entity_id: binary_sensor.rp_ble_stale_alert
        to: "off"
        id: clear
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: raise
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: rp_ble_stale
                  title: "Room presence: BLE node stale"
                  message: >-
                    No phone data for 15 min from: {{ state_attr('binary_sensor.rp_ble_stale_alert', 'nodes') }}.
                    The fingerprint matcher skips those nodes. Check the node (power cycle if it stays dark).
          - conditions:
              - condition: trigger
                id: clear
            sequence:
              - action: persistent_notification.dismiss
                data:
                  notification_id: rp_ble_stale
    mode: single
  - id: rp_kitchen_light_operated
    alias: "RP remember when the kitchen light was operated"
    triggers:
      - trigger: state
        entity_id: light.kitchenlight_kitchen_light
        from: ["on", "off"]
        to: ["on", "off"]
    conditions:
      - condition: template
        value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.rp_kitchen_light_op
        data:
          timestamp: "{{ now().timestamp() }}"
    mode: single
  - id: rp_zone_to_mqtt
    alias: "RP publish zone to MQTT (history log)"
    description: >-
      Retained presence/zone/state every 10 s and on every change of zone / PC lock / radar / the work desk light / the light bar;
      the nl-pi zone-log service writes it to CSV (schema v2) together with the weak zone labels derived from it. wd_light_ts and
      lightbar_ts are the epoch seconds of the last state change of light.channel_b / the light bar.
    triggers:
      - trigger: state
        entity_id:
          - sensor.yui_room_zone
          - sensor.rp_fp_zone
          - binary_sensor.yui_home
          - binary_sensor.rp_pc_locked
          - binary_sensor.kitchenradar_presence
          - light.channel_b
          - light.monitor_light_bar_light_bar
          - light.kitchenlight_kitchen_light
          - light.neopixel_neopixel
          - binary_sensor.gaming_pc_gaming
      - trigger: time_pattern
        seconds: "/10"
    actions:
      - action: mqtt.publish
        data:
          topic: presence/zone/state
          retain: true
          payload: >-
            {{ {'zone': states('sensor.yui_room_zone'), 'fp': states('sensor.rp_fp_zone'),
                'home': states('binary_sensor.yui_home'), 'pc_idle': states('sensor.rp_pc_idle'),
                'pc_online': states('binary_sensor.rp_pc_online'), 'pc_locked': states('binary_sensor.rp_pc_locked'),
                'radar': states('binary_sensor.kitchenradar_presence'),
                'radar_cm': states('sensor.kitchenradar_detection_distance'),
                'wd_light': states('light.channel_b'),
                'wd_light_ts': (as_timestamp(states['light.channel_b'].last_changed) if states['light.channel_b'] is not none else 0),
                'lightbar': states('light.monitor_light_bar_light_bar'),
                'lightbar_ts': (as_timestamp(states['light.monitor_light_bar_light_bar'].last_changed) if states['light.monitor_light_bar_light_bar'] is not none else 0),
                'link_kitchenradar': states('sensor.rp_link_kitchenradar_motion'),
                'link_neopixel': states('sensor.rp_link_neopixel_motion'),
                'link_kitchenrssi': states('sensor.rp_link_kitchenrssi_motion'),
                'kitchen_light': states('light.kitchenlight_kitchen_light'),
                'kitchen_light_ts': (as_timestamp(states['light.kitchenlight_kitchen_light'].last_changed) if states['light.kitchenlight_kitchen_light'] is not none else 0),
                'neopixel': states('light.neopixel_neopixel'),
                'neopixel_ts': (as_timestamp(states['light.neopixel_neopixel'].last_changed) if states['light.neopixel_neopixel'] is not none else 0),
                'gaming': states('binary_sensor.gaming_pc_gaming'),
                'gaming_pc_w': states('sensor.gaming_pc_power'),
                'radar_moving': states('binary_sensor.kitchenradar_moving_target'),
                'radar_move_cm': states('sensor.kitchenradar_moving_distance'),
                'radar_still_cm': states('sensor.kitchenradar_still_distance'),
                'radar_move_en': states('sensor.kitchenradar_moving_energy'),
                'radar_still_en': states('sensor.kitchenradar_still_energy')} | tojson }}
    mode: queued
  - id: rp_pc_desk_occupied_light_bar_on
    alias: "Room presence: PC desk occupied -> light bar on (warm)"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.room_zone_pc_desk
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.room_presence_automations
        state: "on"
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: time
        after: "07:30:00"
        before: "00:30:00"
      - condition: state
        entity_id: light.monitor_light_bar_light_bar
        state: "off"
      - condition: template
        value_template: >
          {{ (now() - states.light.monitor_light_bar_light_bar.last_changed).total_seconds() > 600 }}
    actions:
      - action: light.turn_on
        target:
          entity_id: light.monitor_light_bar_light_bar
        data:
          color_temp_kelvin: 2900
          brightness_pct: 55
  - id: rp_pc_desk_empty_light_bar_off
    alias: "Room presence: PC desk empty 10 min -> light bar off"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.room_zone_pc_desk
        to: "off"
        for: "00:10:00"
    conditions:
      - condition: state
        entity_id: input_boolean.room_presence_automations
        state: "on"
      - condition: time
        after: "07:30:00"
        before: "00:30:00"
      - condition: state
        entity_id: light.monitor_light_bar_light_bar
        state: "on"
      - condition: template
        value_template: >
          {{ (now() - states.light.monitor_light_bar_light_bar.last_changed).total_seconds() > 600 }}
    actions:
      - action: light.turn_off
        target:
          entity_id: light.monitor_light_bar_light_bar
  - id: rp_work_desk_occupied_light_on
    alias: "Room presence: work desk occupied -> channel B on"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.room_zone_work_desk
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.room_presence_automations
        state: "on"
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: time
        after: "07:30:00"
        before: "00:30:00"
      - condition: state
        entity_id: light.channel_b
        state: "off"
      - condition: template
        value_template: >
          {{ (now() - states.light.channel_b.last_changed).total_seconds() > 600 }}
    actions:
      - action: light.turn_on
        target:
          entity_id: light.channel_b
  - id: rp_work_desk_empty_light_off
    alias: "Room presence: work desk empty 10 min -> channel B off"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.room_zone_work_desk
        to: "off"
        for: "00:10:00"
    conditions:
      - condition: state
        entity_id: input_boolean.room_presence_automations
        state: "on"
      - condition: time
        after: "07:30:00"
        before: "00:30:00"
      - condition: state
        entity_id: light.channel_b
        state: "on"
      - condition: template
        value_template: >
          {{ (now() - states.light.channel_b.last_changed).total_seconds() > 600 }}
    actions:
      - action: light.turn_off
        target:
          entity_id: light.channel_b
